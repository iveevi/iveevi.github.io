[[other]]
title = "Projective Shape Metamorphosis With Optimal Transport"
venue = "Bachelor's Thesis"
year = "2025"
url = "other/Butterfly.pdf"
links = [{ label = "Full thesis", url = "other/PSMWOT.pdf" }]
summary = "Morphing one shape into another from outlines alone usually needs derivatives, which outlines do not give up easily. Can it be done without them? Treating each outline as a pile of mass and moving one onto the other pushes the vertices directly."

