[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "s"

[dependencies]
console_error_panic_hook = "0.1.7"
delaunator = "1.1.0"
js-sys = "0.3.104"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["HtmlImageElement", "CanvasRenderingContext2d", "ImageData", "Window", "Document", "HtmlElement", "CssStyleDeclaration", "Performance", "Location", "Navigator", "Clipboard"] }
wgpu = "30.0.0"
